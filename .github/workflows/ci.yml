name: CI/CD ML Power Consumption Project

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:

  # ------------------------------------------------------
  # 1) JOB: BUILD + TEST + DVC REPRO USING CONDA
  # ------------------------------------------------------
  build-test-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1. Install Conda (miniconda)
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ml_project
          environment-file: environment.yml
          auto-update-conda: false
          use-only-tar-bz2: true
          python-version: "3.10"

      - name: Check Conda environment
        run: |
          conda info
          conda list

      # 2. Install DVC + MLflow on conda env
      - name: Install DVC + MLflow
        run: |
          conda run -n ml_project pip install dvc[s3]==3.64.0 mlflow pytest

      - name: Configure DVC Remote
        run: |
          conda run -n ml_project dvc remote modify storage access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          conda run -n ml_project dvc remote modify storage secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 3. Pull DVC data
      - name: DVC Pull
        run: |
          conda run -n ml_project dvc pull

      # 4. Run tests
    #  - name: Run Pytest
    #   run: |
    #      conda run -n ml_project pytest -q

      # 5. Run DVC pipeline (training)
      - name: Run DVC Repro
        run: |
          conda run -n ml_project dvc repro

      # 6. Push trained artifacts back
      - name: Push artifacts to DVC remote
        run: |
          conda run -n ml_project dvc push

  # ------------------------------------------------------
  # 2) JOB: DOCKER BUILD FOR FASTAPI API
  # ------------------------------------------------------
  build-api:
    runs-on: ubuntu-latest
    needs: build-test-train

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ml-power-api:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ml-power-api:latest
  deploy-prod:
      needs: build-api
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/main'

  # ------------------------------------------------------
  # 3) JOB: PROMOTE API TO PRODUCTION
  # ------------------------------------------------------
      steps:
        - name: Deploy to EC2
          uses: appleboy/ssh-action@v1.0.0
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ec2-user
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ml-power-api:latest
              docker stop ml-api || true
              docker rm ml-api || true
              docker run -d --name ml-api -p 80:8000 \
                ${{ secrets.DOCKERHUB_USERNAME }}/ml-power-api:latest
